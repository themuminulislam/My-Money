*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Serif Bengali','Akhond Bangla','Hind Siliguri',serif;font-size:16px;line-height:1.6}

.pill.sm{padding:9px 14px;font-size:14px;white-space:nowrap;flex:none}.tile{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--band);border-radius:16px;padding:14px 16px;margin-bottom:14px}

.empty{color:var(--mut);text-align:center;padding:14px}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-left:6px;white-space:nowrap}
.rb{cursor:pointer}.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.avw{position:relative;width:96px;margin:0 auto}.avw .av{border:4px solid #fff}
.cam{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--pri);border:0;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pill.dng{background:var(--out);box-shadow:none}.lr small{margin-right:2px}
#sheet>div{max-height:92vh;overflow-y:auto}
#dlg{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:center;justify-content:center;z-index:12;padding:20px}
#dlg.show{display:flex}#dlg>div{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:380px;max-height:85vh;overflow:auto}
.dgb{color:var(--mut)}.dgb b{color:var(--ink)}.dgb label{display:block;font-size:13px;margin:10px 0 3px}
#toast{z-index:20}

/* ===== গ্লাস ইফেক্ট ===== */
:root{--pg:linear-gradient(165deg,#d6e8ff 0%,#eaf2ff 42%,#dcf3f0 100%);--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.9);--gb:rgba(255,255,255,.78);--gs:0 8px 30px rgba(30,80,170,.13);--inp:rgba(255,255,255,.62)}

body{background:var(--pg);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 320px at 6% 6%,rgba(15,111,222,.3),transparent 70%),radial-gradient(380px 300px at 100% 30%,rgba(91,168,160,.28),transparent 70%),radial-gradient(440px 340px at 18% 100%,rgba(133,114,154,.26),transparent 70%)}
.card,nav,.chip,.search,.tile,.st,.sc .ico,.calc button,.lang,.bk,.sync{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--gb);box-shadow:var(--gs)}
input,select,textarea,.ddb{background:var(--inp);border:1px solid var(--gb);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#sheet,#dlg{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#sheet>div,#dlg>div,.ddm{background:var(--glass2);-webkit-backdrop-filter:blur(28px) saturate(1.6);backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--gb)}
.band{background:rgba(110,150,220,.1)}.bar{background:rgba(120,150,200,.22)}
.hero{border:1px solid rgba(255,255,255,.32);box-shadow:0 14px 36px rgba(15,80,200,.35)}
.promo{border:1px solid rgba(255,255,255,.28);box-shadow:var(--gs)}
.ico{background:var(--pri2)}
.pill.ol{background:var(--pri2);color:var(--pri);box-shadow:none}
.bk{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:8px 14px;color:var(--ink);font-size:15px;margin:0 0 14px;max-width:100%}.bk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bk svg:first-child{color:var(--pri);flex:none}.hd .bk{margin:0}
.sync{display:flex;align-items:center;gap:10px;width:100%;border-radius:16px;padding:12px 14px;color:var(--ink);text-align:left;margin-bottom:14px;font-size:14px}.sync svg{color:var(--pri);flex:none}
.hero.acc{margin-top:8px}.hd{padding:12px 0 6px}.top{padding:10px 0}
#dlg .f{flex-wrap:wrap}

const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h1M12 12h1M8 16h1M12 16h4"/>',note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',chev:'<path d="M9 5l7 7-7 7"/>',back:'<path d="M15 5l-7 7 7 7"/>',wal:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',dn:'<path d="M12 4v14M6 12l6 6 6-6"/>',up:'<path d="M12 20V6M6 12l6-6 6 6"/>',chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',srch:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',dd:'<path d="M6 9l6 6 6-6"/>',ok:'<path d="M5 12l5 5 9-10"/>',moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',save:'<path d="M12 4v10M8 10l4 4 4-4M5 20h14"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',hash:'<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>',pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',cloud:'<path d="M7 18a4 4 0 0 1-.6-7.9A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/>',xls:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11l5 6M14 11l-5 6"/>',txt:'<path d="M8 8h8M8 12h8M8 16h5"/><rect x="4" y="3" width="16" height="18" rx="3"/>',copy:'<rect x="8" y="8" widt const preGIS=()=>{if(window.google&&google.accounts&&google.accounts.oauth2)return;if(document.getElementById('gis'))return;const s=document.createElement('script');s.id='gis';s.src='https://accounts.google.com/gsi/client';s.async=true;document.head.appendChild(s)};
function gToken(inter){return new Promise((res,rej)=>{if(tokOK())return res(TOK);if(!inter)return rej(new Error('অনুমতি প্রয়োজন'));const cid=S.drive.cid||GCID;if(!cid)return rej(new Error('Client ID পাওয়া যায়নি'));if(!(window.google&&google.accounts&&google.accounts.oauth2)){preGIS();return rej(new Error('Google সার্ভিস লোড হচ্ছে, কিছুক্ষণ পর আবার চেষ্টা করুন'))}google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return rej(new Error('অনুমতি পাওয়া যায়নি'));TOK=r.access_token;TEXP=Date.now()+r.expires_in*1000;S.drive.ok=true;res(TOK)},error_callback:()=>rej(new Error('অনুমোদন বাতিল হয়েছে'))}).requestAccessToken({prompt:S.drive.ok?'':'consent'})})}
async function dapi(u,o={}){const r=await fetch(u,Object.assign({},o,{headers:Object.assign({Authorization:'Bearer '+TOK},o.headers||{})}));if(!r.ok){if(r.status===401)TOK='';throw new Error(r.status===401?'অনুমতির মেয়াদ শেষ হয়েছে':'Drive সার্ভার ত্রুটি ('+r.status+')')}return r}
async function dfind(){const r=await dapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q='+encodeURIComponent("name='moneybag-backup.json'"));const j=await r.json();return j.files&&j.files[0]}
async function driveUp(silent){try{await gToken(!silent);const body=JSON.stringify(Object.assign({},S,{drive:undefined})),f=await dfind();if(f)await dapi('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});else{const bd='mbx'+Date.now(),mp=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:'moneybag-backup.json',parents:['appDataFolder']})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;await dapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp})}S.drive.last=new Date().toISOString();S.drive.sig=sigNow();render();if(!silent)toast('Google Drive-এ ব্যাকআপ সম্পন্ন হয়েছে')}catch(e){if(!silent)toast(e.message||'ড্রাইভ ব্যাকআপ সম্পন্ন হয়নি')}}
async function driveRestore(){try{await gToken(true);const f=await dfind();if(!f)throw new Error('ড্রাইভে কোনো ব্যাকআপ পাওয়া যায়নি');const o=await(await dapi('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media')).json();if(!o||!Array.isArray(o.ents))throw new Error('ব্যাকআপ ফাইলটি সঠিক নয়');ask('ড্রাইভ থেকে পুনরুদ্ধার করবেন?','বর্তমান ডেটা ড্রাইভের ব্যাকআপ দ্বারা প্রতিস্থাপিত হবে।','পুনরুদ্ধার করুন',()=>{applyData(o);S.drive.sig=sigNow();S.drive.last=f.modifiedTime||new Date().toISOString();render();toast('ড্রাইভ থেকে ডেটা পুনরুদ্ধার করা হয়েছে')})}catch(e){toast(e.message||'পুনরুদ্ধার সম্ভব হয়নি')}}
function driveDlg(){preGIS();const d=S.drive,c=d.cid||GCID;
if(!c)return dlg('Google Drive ব্যাকআপ',`<p style="margin:0 0 8px">আপনার ডেটা আপনার নিজস্ব Google Drive-এর একটি সুরক্ষিত, গোপন ফোল্ডারে সংরক্ষণ করা যাবে। এজন্য একবার সংযোগ স্থাপন করতে হবে।</p><small>১) console.cloud.google.com-এ একটি নতুন প্রজেক্ট খুলুন।<br>২) “Google Drive API” সক্রিয় করুন।<br>৩) OAuth consent screen কনফিগার করে নিজের ইমেইলকে Test user হিসেবে যুক্ত করুন।<br>৪) Credentials থেকে “OAuth client ID” (Web application) তৈরি করুন এবং Authorized JavaScript origins-এ এই ঠিকানাটি দিন: <b>${esc(location.origin)}</b><br>৫) প্রাপ্ত Client ID নিচে পেস্ট করুন।</small><label>OAuth Client ID</label><input id="gc" placeholder="xxxxxxxx.apps.googleusercontent.com">`,[['বাতিল','chip'],['সংযুক্ত করুন','pill',()=>{const v=$('#gc').value.trim();if(!/\.apps\.googleusercontent\.com$/.test(v)){toast('সঠিক Client ID প্রদান করুন');return false}S.drive.cid=v;S.drive.ok=false;save();render();driveDlg();return false}]]);
dlg('Google Drive ব্যাকআপ',`<p style="margin:0 0 8px">সংযোগ: <b>সক্রিয়</b><br>সর্বশেষ ব্যাকআপ: <b>${d.last?fmtDT(d.last):'এখনো হয়নি'}</b><br>স্বয়ংক্রিয় ব্যাকআপ: <b>${d.auto?'চালু':'বন্ধ'}</b></p><small>ডেটা আপনার Drive-এর অ্যাপ-নির্দিষ্ট গোপন ফোল্ডারে সংরক্ষিত হয়। সুরক্ষার স্বার্থে অ্যাপটি শুধু নিজের ফাইলই দেখতে পারে। অ্যাপ খোলা থাকলে পরিবর্তনগুলো স্বয়ংক্রিয়ভাবে ব্যাকআপ হয়; অনুমতির মেয়াদ শেষ হলে একবার ট্যাপ করে সিঙ্ক করতে হয়।</small>`,[['এখনই ব্যাকআপ নিন','pill',()=>{driveUp(false);return false}],['ড্রাইভ থেকে পুনরুদ্ধার','chip',()=>{driveRestore();return false}],['স্বয়ংক্রিয় ব্যাকআপ: '+(d.auto?'বন্ধ করুন':'চালু করুন'),'chip',()=>{d.auto=!d.auto;save();driveDlg();return false}],['সংযোগ বিচ্ছিন্ন করুন','chip',()=>{S.drive=Object.assign(seed().drive,{});TOK='';save();render();toast('Google Drive সংযোগ বিচ্ছিন্ন করা হয়েছে')}],['বন্ধ করুন','chip']])}
